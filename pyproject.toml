[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note-manager"
version = "0.1.0"
description = "A personal note manager with CLI and web interfaces."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
note = "note.__main__:app"

[tool.setuptools]
packages = ["note"]

[tool.setuptools.package-data]
note = ["templates/*.html"]

[tool.coverage.run]
source = ["note"]
omit = [
    "note/__main__.py",
    "note/web_app.py",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
