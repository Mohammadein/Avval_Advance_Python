{% extends "base.html" %}

{% block title %}Notes{% endblock %}

{% block content %}
    <h2>{{ notes | length }} Notes</h2>

    {% for note in notes %}
        <article>
            <h3>
                <a href="/notes/{{ note.id }}">{{ note.title }}</a>
            </h3>
            <p>ID: {{ note.id }}</p>
        </article>
    {% else %}
        <p>There are no notes.</p>
    {% endfor %}
{% endblock %}
